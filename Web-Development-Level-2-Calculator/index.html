<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator | OASIS INFOBYTE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="calculator">

            <div class="heading">
                <p>OASIS INFOBYTE • LEVEL 2 • TASK 1</p>
                <h1>Calculator</h1>
            </div>

            <!-- Calculator Display -->
            <div class="display">

                <div id="previous-operand" class="previous-operand"></div>

                <div id="current-operand" class="current-operand">
                    0
                </div>

                <div id="error-message" class="error-message"></div>

            </div>

            <!-- Calculator Buttons -->
            <div class="buttons">

                <!-- Row 1 -->
                <button class="action" data-clear>AC</button>
                <button class="action" data-delete>DEL</button>
                <button class="operator" data-operation="%">%</button>
                <button class="operator" data-operation="÷">÷</button>

                <!-- Row 2 -->
                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>
                <button class="operator" data-operation="×">×</button>

                <!-- Row 3 -->
                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>
                <button class="operator" data-operation="−">−</button>

                <!-- Row 4 -->
                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>
                <button class="operator" data-operation="+">+</button>

                <!-- Row 5 -->
                <button class="zero" data-number="0">0</button>
                <button data-number=".">.</button>
                <button class="equals" data-equals>=</button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
