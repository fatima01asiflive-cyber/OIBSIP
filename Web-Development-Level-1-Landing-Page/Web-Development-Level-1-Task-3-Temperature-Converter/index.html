<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter | OASIS INFOBYTE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="converter-container">

        <section class="converter-card">

            <div class="header">
                <div class="temperature-icon">🌡️</div>

                <h1>Temperature Converter</h1>

                <p>
                    Convert temperatures between Celsius,
                    Fahrenheit and Kelvin.
                </p>
            </div>


            <form id="converter-form">

                <!-- Temperature Input -->

                <div class="form-group">

                    <label for="temperature">
                        Enter Temperature
                    </label>

                    <input type="number" id="temperature" placeholder="e.g. 25" step="any">

                    <small id="input-error"></small>

                </div>


                <!-- Input Unit -->

                <div class="form-group">

                    <label for="input-unit">
                        Convert From
                    </label>

                    <select id="input-unit">

                        <option value="celsius">
                            Celsius (°C)
                        </option>

                        <option value="fahrenheit">
                            Fahrenheit (°F)
                        </option>

                        <option value="kelvin">
                            Kelvin (K)
                        </option>

                    </select>

                </div>


                <!-- Output Unit -->

                <div class="form-group">

                    <label for="output-unit">
                        Convert To
                    </label>

                    <select id="output-unit">

                        <option value="all">
                            All Units
                        </option>

                        <option value="celsius">
                            Celsius (°C)
                        </option>

                        <option value="fahrenheit">
                            Fahrenheit (°F)
                        </option>

                        <option value="kelvin">
                            Kelvin (K)
                        </option>

                    </select>

                </div>


                <!-- Convert Button -->

                <button type="submit" class="convert-btn">
                    Convert Temperature
                </button>

            </form>


            <!-- Error Message -->

            <div id="absolute-zero-error" class="error-box"></div>


            <!-- Results -->

            <section id="results" class="results">

                <h2>Converted Temperature</h2>

                <div class="result-grid">

                    <div class="result-card">
                        <span>°C</span>

                        <strong id="celsius-result">
                            —
                        </strong>

                        <p>Celsius</p>
                    </div>


                    <div class="result-card">
                        <span>°F</span>

                        <strong id="fahrenheit-result">
                            —
                        </strong>

                        <p>Fahrenheit</p>
                    </div>


                    <div class="result-card">
                        <span>K</span>

                        <strong id="kelvin-result">
                            —
                        </strong>

                        <p>Kelvin</p>
                    </div>

                </div>

            </section>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
